[osd]
background_opacity = 0.96999997831881046

[plugin_settings."aabidk20/yt-music"]
debug_logging = true
mini_open_near_click = true
mini_placement = "attached"
panel_open_near_click = true

[plugin_settings."ahmedhossamdev/sticky-notes"]
file_format = "json"

[plugin_settings."autumn/network-toolkit"]
hotspot_ssid = "ColdJr"
widget_display_mode = "network_bluetooth"
widget_indicator_dots = "none"

[plugin_settings."cleboost/ssh-launcher"]
terminal = "/home/marcio/.local/bin/noctalia-ssh-kitty"

[plugin_settings."felipeartur/ai-usagebar"]
panel_open_near_click = true

[plugin_settings."joshuaslate/shelly"]
notify = true

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "joshuaslate/shelly",
    "felipeartur/ai-usagebar",
    "ahmedhossamdev/sticky-notes",
    "alexander/screen-toolkit",
    "noctalia/translator",
    "cleboost/ssh-launcher",
    "weinguyen/procmon"
]

[shell]
avatar_path = "/home/marcio/Pictures/My/profile_kit.png"
clipboard_auto_paste = "off"
font_family = "Adwaita Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
settings_show_advanced = false
setup_wizard_enabled = false
telemetry_enabled = true

    [shell.launcher]
    categories = false
    compact = true
    provider_prefix = ":"
    sort_by_usage = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    launcher_position = "top_left"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    transparency_mode = "soft"

[theme]
builtin = "Noctalia"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "niri", "btop", "gtk3", "gtk4", "qt", "kcolorscheme", "starship" ]
    community_ids = [ "codex", "brave-origin", "blender", "inkscape", "libreoffice", "fzf" ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.atuin]
        input_path = "~/.config/atuin/noctalia-template.toml"
        output_path = "~/.config/atuin/themes/noctalia.toml"

        [theme.templates.user.kitty-colors]
        input_path = "/usr/share/noctalia/assets/templates/kitty/kitty.conf"
        output_path = "~/.config/kitty/themes/noctalia.conf"
        post_hook = "bash \"$HOME/.dotfiles/scripts/kitty-noctalia-colors.sh\""

        [theme.templates.user.nvim-base16]
        input_path = "~/.config/nvim/lua/theme/matugen-template.lua"
        output_path = "~/.config/nvim/lua/theme/matugen.lua"
        post_hook = "pkill -SIGUSR1 nvim || true"

        [theme.templates.user.pywalfox]
        input_path = "~/.dotfiles/config/noctalia/templates-v5/pywalfox.json"
        output_path = "~/.cache/wal/colors.json"
        post_hook = "pywalfox update"

        [theme.templates.user.steam]
        input_path = "~/.dotfiles/config/noctalia/templates-v5/steam.css"
        output_path = "~/.steam/steam/steamui/skins/Material-Theme/css/main/colors/matugen.css"

        [theme.templates.user.zathura]
        input_path = "~/.dotfiles/config/noctalia/templates-v5/zathurarc"
        output_path = "~/.config/zathura/noctaliarc"

[wallpaper]
directory = "/home/marcio/Pictures/Wallpapers"
edge_smoothness = 0.050000000000000003
enabled = true
fill_mode = "crop"
transition = [ "fade", "disc", "stripes", "wipe", "honeycomb" ]
transition_duration = 1500

    [wallpaper.automation]
    enabled = true
    interval_seconds = 300
    order = "random"

    [wallpaper.default]
    path = "/home/marcio/Pictures/Wallpapers/Time_4k.png"

    [wallpaper.last]
    path = "/home/marcio/Pictures/Wallpapers/Time_4k.png"

    [wallpaper.monitors.DP-1]
    path = "/home/marcio/Pictures/Wallpapers/tux_PC.png"

    [wallpaper.monitors.DP-2]
    path = "/home/marcio/Pictures/Wallpapers/Time_4k.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/marcio/Pictures/Wallpapers/Time_4k.png"

    [[wallpaper.favorite]]
    path = "/home/marcio/Pictures/Wallpapers/2_pink_dust_dark_4k.png"
    theme_mode = "dark"

[weather]
enabled = true
unit = "metric"

[widget.active_window]
capsule = true
max_length = 150
min_length = 0
title_scroll = "always"

[widget.audio_visualizer]
bands = 20
reversed = true
width = 80

    [widget.audio_visualizer.actions]
    back = "media previous"
    forward = "media next"
    left = "panel-toggle control-center media"
    right = "media toggle"
    scroll_down = "media previous"
    scroll_up = "media next"

[widget.bar]
extras = "none"
show_value = false
type = "felipeartur/ai-usagebar:bar"
vendor = "openai"
visualization = "gauge"

[widget.bar_2]
type = "ahmedhossamdev/sticky-notes:bar"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
anchor = true

[widget.launcher]
capsule = true

[widget.media]
artist_first = true
capsule = true
hide_when_no_media = true
max_length = 150
min_length = 0
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "both"

[widget.privacy]
hide_inactive = true

[widget.shelly]
bar_label = "count_only"
glyph = "arrow-big-up-lines-filled"
hide_when_up_to_date = true
type = "joshuaslate/shelly:shelly"

[widget.spacer2]
length = 32
type = "spacer"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
length = 32
type = "spacer"

[widget.spacer_4]
length = 32
type = "spacer"

[widget.spacer_5]
length = 32
type = "spacer"

[widget.sysmon]
show_value = false

[widget.tray]
capsule = true

[widget.volume]
show_label = false

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.widget_2]
capsule = true
type = "autumn/network-toolkit:widget"

[widget.widget_3]
