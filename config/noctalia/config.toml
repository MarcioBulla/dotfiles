# Noctalia v5.1: merged user configuration, including GUI preferences.
# Keep v4 settings.json and user-templates.toml for rollback.
# GUI overrides in ~/.local/state/noctalia/settings.toml take precedence.
[include]
autoload = false

[bar.default]
background_opacity = 0.59999998658895493
center = [ "group:g5", "widget_2", "widget_3", "spacer_5" ]
end = [ "group:g7", "spacer_5", "group:g6", "spacer_2", "group:g3", "spacer2", "privacy", "group:g4" ]
font_family = "JetBrainsMono Nerd Font"
font_scale = 0.79999998956918716
font_weight = 700
margin_edge = 0
margin_ends = 0
padding = 2
position = "top"
radius = 0
start = [ "launcher", "spacer_4", "group:g1", "spacer_3", "workspaces", "active_window" ]
thickness = 20

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bar", "cpu", "temp", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network", "bluetooth", "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "battery", "notifications", "control-center" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "widget", "clock", "bar_2" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g6"
    members = [ "tray", "shelly" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g7"
    members = [ "audio_visualizer", "media" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    name = "Doctorado"
    type = "google"

    [calendar.account.personal_google2]
    color = "secondary"
    name = "Personal"
    type = "google"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "noctalia/screen_recorder:toggle"

[[control_center.shortcuts]]
type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = false

    [desktop_widgets.widget]

[dock]
enabled = false

[hot_corners]
delay_ms = 200
enabled = true

    [hot_corners.bottom_left]
    action = "window_switcher"

[idle]
pre_action_fade_seconds = 5.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 660.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600.0

[location]
address = "ba, Argentina"
auto_locate = false

[lockscreen]
blur_intensity = 0.0
lock_before_suspend = true
tint_intensity = 0.0

