# BEGIN_KITTY_THEME
# Noctalia
include themes/noctalia.conf
# END_KITTY_THEME
#

# Noctalia updates colors through the socket without resetting font zoom.
# These options require a new Kitty process; manual reload: ctrl+shift+f5.
auto_reload_config -1
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-noctalia-{kitty_pid}

font_family      jetbrains mono nerd font
font_size        10
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
background_opacity 0.7
enable_audio_bell no

copy_on_select yes


map ctrl+shift+n new_os_window_with_cwd
