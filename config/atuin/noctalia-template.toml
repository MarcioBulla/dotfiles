# Rendered automatically by Noctalia when wallpaper colors or light/dark mode change.
# Edit this template; themes/noctalia.toml is generated.
[theme]
name = "noctalia"
parent = "default"

[colors]
AlertInfo = "{{colors.primary.default.hex}}"
AlertWarn = "{{colors.tertiary.default.hex}}"
AlertError = "{{colors.error.default.hex}}"
Annotation = "{{colors.on_surface_variant.default.hex}}"
Base = "{{colors.on_surface.default.hex}}"
Guidance = "{{colors.secondary.default.hex}}"
Important = "{{colors.primary.default.hex}}"
Title = "{{colors.primary.default.hex}}"
Muted = "{{colors.on_surface_variant.default.hex}}"
SyntaxCommand = "{{colors.primary.default.hex}}"
SyntaxFlag = "{{colors.secondary.default.hex}}"
SyntaxString = "{{colors.tertiary.default.hex}}"
SyntaxVariable = "{{colors.secondary.default.hex}}"
SyntaxOperator = "{{colors.on_surface_variant.default.hex}}"
SyntaxComment = "{{colors.outline.default.hex}}"
