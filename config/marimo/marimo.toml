[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = false

[ai]
inline_tooltip = true

[ai.ollama]
base_url = "http://localhost:11434/v1"

[ai.models]
custom_models = ["ollama/llama3.1:8b", "ollama/qwen2.5-coder:7b"]
displayed_models = ["ollama/qwen3:8b", "ollama/llama3.1:8b"]
edit_model = "ollama/llama3.1:8b"
chat_model = "ollama/llama3.1:8b"

[ai.open_ai]
api_key = ""

[ai.custom_providers]

[runtime]
reactive_tests = true
std_stream_max_bytes = 1000000
default_auto_download = ["ipynb", "html"]
on_cell_change = "autorun"
output_max_bytes = 8000000
default_sql_output = "auto"
show_tracebacks = false
watcher_on_save = "lazy"
auto_instantiate = false
default_csv_encoding = "utf-8"
auto_reload = "off"

[completion]
copilot = false
activate_on_typing = true
signature_hint_on_typing = false

[experimental]
rtc_v2 = true

[mcp]
presets = []

[mcp.mcpServers]

[language_servers.pylsp]
enable_mypy = true
enabled = false
enable_pydocstyle = false
enable_pyflakes = false
enable_ruff = true
enable_pylint = false
enable_flake8 = false

[formatting]
line_length = 79

[snippets]
custom_paths = []
include_default_snippets = true

[server]
browser = "default"
follow_symlink = false

[package_management]
manager = "uv"

[diagnostics]
sql_linter = true

[display]
code_editor_font_size = 16
default_table_page_size = 10
default_width = "medium"
default_table_max_columns = 50
cell_output = "below"
reference_highlighting = true
dataframes = "rich"
theme = "system"

[keymap]
destructive_delete = true
preset = "vim"

[keymap.overrides]
